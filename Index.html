<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="style.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Рикардо одобряет</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Иконки -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Фон с Рикардо (кликабельный) -->
    <!-- Фон с Рикардо (кликабельный и наводимый) -->
  <div class="ricardo-bg" id="ricardoBg" title="Наведи на Рикардо 👇">
    <!-- Заменили ссылку на локальный файл -->
    <img src="ricardo.gif"
         alt="Ricardo Milos"
         class="ricardo-img"
         id="ricardoImg" />
  </div>

  <!-- Затемнение поверх фона -->
  <div class="overlay"></div>

  <!-- Карточка авторизации -->
  <main class="login-card">
    <div class="logo">
      <div class="logo-mark">R</div>
      <h1>Добро пожаловать</h1>
      <p class="subtitle">Войдите, чтобы продолжить танцевать</p>
    </div>

    <div class="buttons">
      <!-- Google -->
      <button class="btn btn-google" data-provider="Google">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-.96 2.4-2 3.1v2.6h3.2c1.9-1.7 3-4.3 3-7.3 0-.7-.06-1.4-.18-2.1H12z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.6-2.4l-3.2-2.6c-.9.6-2 .96-3.4.96-2.6 0-4.8-1.76-5.6-4.12H3.06v2.6C4.7 19.6 8.06 22 12 22z"/>
          <path fill="#FBBC05" d="M6.4 13.84A6 6 0 0 1 6.08 12c0-.64.11-1.26.32-1.84V7.56H3.06A10 10 0 0 0 2 12c0 1.6.38 3.1 1.06 4.44l3.34-2.6z"/>
          <path fill="#4285F4" d="M12 5.96c1.47 0 2.78.5 3.82 1.5l2.86-2.86C16.96 2.98 14.7 2 12 2 8.06 2 4.7 4.4 3.06 7.56l3.34 2.6C7.2 7.72 9.4 5.96 12 5.96z"/>
        </svg>
        <span>Войти через Google</span>
      </button>

      <!-- Apple -->
      <button class="btn btn-apple" data-provider="Apple">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M16.37 12.6c.02 2.6 2.28 3.46 2.3 3.47-.02.06-.36 1.23-1.18 2.43-.71 1.04-1.45 2.07-2.62 2.09-1.15.02-1.52-.68-2.83-.68-1.31 0-1.72.66-2.81.7-1.13.04-1.99-1.12-2.7-2.15-1.48-2.13-2.61-6.02-1.09-8.65.75-1.3 2.1-2.13 3.56-2.15 1.1-.02 2.15.74 2.83.74.67 0 1.94-.91 3.27-.78.56.02 2.14.22 3.15 1.7-.08.05-1.88 1.1-1.88 3.28zM14.2 5.3c.6-.73 1-1.74.89-2.75-.87.04-1.93.58-2.55 1.3-.56.64-1.04 1.67-.91 2.65.97.08 1.97-.49 2.57-1.2z"/>
        </svg>
        <span>Войти через Apple</span>
      </button>

      <!-- GitHub -->
      <button class="btn btn-github" data-provider="GitHub">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.02c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.27 5.68.41.35.78 1.05.78 2.12v3.14c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/>
        </svg>
        <span>Войти через GitHub</span>
      </button>
    </div>

    <p class="footnote">Нажимая «Войти», вы соглашаетесь с условиями сервиса и политикой конфиденциальности.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
